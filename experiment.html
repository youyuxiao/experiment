<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习研究实验</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspsych/7.3.4/jspsych.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jspsych/7.3.4/themes/default.css">
<style>
  /* ===== 全局样式 ===== */
  :root {
    --primary: #2563eb;
    --primary-light: #eff6ff;
    --text: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --bg: #f8fafc;
    --white: #ffffff;
    --success: #16a34a;
    --warning: #d97706;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
  }

  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
    margin: 0;
  }

  .jspsych-content-wrapper {
    max-width: 820px !important;
  }

  .jspsych-content {
    padding: 0 !important;
    max-width: 100% !important;
  }

  /* ===== 卡片容器 ===== */
  .exp-card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 48px;
    margin: 32px auto;
    max-width: 780px;
  }

  .exp-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 8px 0;
  }

  .exp-subtitle {
    font-size: 14px;
    color: var(--text-muted);
    margin: 0 0 32px 0;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .exp-body {
    font-size: 16px;
    color: var(--text);
    line-height: 1.9;
  }

  /* ===== 按钮 ===== */
  .btn {
    display: inline-block;
    padding: 14px 36px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 24px;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
  .btn:active { transform: translateY(0); }
  .btn-secondary { background: var(--white); color: var(--primary); border: 2px solid var(--primary); }
  .btn-secondary:hover { background: var(--primary-light); }

  /* ===== 前测选择题 ===== */
  .pretest-options { list-style: none; padding: 0; margin: 24px 0; }
  .pretest-options li {
    margin-bottom: 12px;
  }
  .pretest-options label {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 16px;
  }
  .pretest-options label:hover { border-color: var(--primary); background: var(--primary-light); }
  .pretest-options input[type=radio] { width: 18px; height: 18px; accent-color: var(--primary); flex-shrink: 0; }
  .pretest-options input[type=radio]:checked + span { font-weight: 600; }
  .pretest-options label:has(input:checked) { border-color: var(--primary); background: var(--primary-light); }

  /* ===== AI 聊天界面 ===== */
  .chat-container {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin: 24px 0;
    background: var(--white);
  }

  .chat-header {
    background: linear-gradient(135deg, #1e40af, #3b82f6);
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .chat-avatar {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .chat-header-info { line-height: 1.3; }
  .chat-header-name { font-weight: 700; font-size: 15px; }
  .chat-header-status { font-size: 12px; opacity: 0.85; }

  .chat-messages {
    padding: 20px;
    min-height: 200px;
    max-height: 420px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: #f9fafb;
  }

  .msg {
    display: flex;
    gap: 10px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .msg-ai { align-items: flex-start; }
  .msg-user { flex-direction: row-reverse; }

  .msg-icon {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .msg-ai .msg-icon { background: linear-gradient(135deg, #1e40af, #3b82f6); color: white; }
  .msg-user .msg-icon { background: #e2e8f0; }

  .msg-bubble {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.7;
  }
  .msg-ai .msg-bubble { background: var(--white); border: 1px solid var(--border); border-top-left-radius: 4px; color: var(--text); }
  .msg-user .msg-bubble { background: var(--primary); color: white; border-top-right-radius: 4px; }

  /* ===== 预设问题按钮 ===== */
  .question-chips {
    padding: 16px 20px;
    background: var(--white);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .question-chips-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .chips-row { display: flex; flex-wrap: wrap; gap: 8px; }

  .chip {
    padding: 8px 16px;
    background: var(--primary-light);
    color: var(--primary);
    border: 1px solid #bfdbfe;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    text-align: left;
  }
  .chip:hover { background: var(--primary); color: white; border-color: var(--primary); }
  .chip:disabled { opacity: 0.4; cursor: not-allowed; background: var(--primary-light); color: var(--primary); }

  /* ===== 量表 ===== */
  .scale-item {
    margin-bottom: 28px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }
  .scale-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

  .scale-q {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    color: var(--text);
  }

  .scale-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .scale-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 4px;
  }

  .scale-point {
    flex: 1;
    text-align: center;
  }

  .scale-point input[type=radio] { accent-color: var(--primary); width: 20px; height: 20px; cursor: pointer; }
  .scale-point label { display: block; font-size: 13px; color: var(--text-muted); margin-top: 4px; cursor: pointer; }

  /* ===== 测验题 ===== */
  .test-item {
    margin-bottom: 32px;
    padding: 24px;
    background: var(--bg);
    border-radius: 10px;
    border-left: 4px solid var(--primary);
  }

  .test-q {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text);
  }

  .test-options { list-style: none; padding: 0; margin: 0 0 12px 0; }
  .test-options li { margin-bottom: 8px; }
  .test-options label {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    transition: all 0.15s;
    background: var(--white);
  }
  .test-options label:hover { border-color: var(--primary); background: var(--primary-light); }
  .test-options input[type=radio] { margin-top: 3px; accent-color: var(--primary); flex-shrink: 0; }
  .test-options label:has(input:checked) { border-color: var(--primary); background: var(--primary-light); }

  .test-textarea {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    line-height: 1.7;
    resize: vertical;
    min-height: 80px;
    color: var(--text);
    box-sizing: border-box;
    transition: border-color 0.15s;
  }
  .test-textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
  .test-textarea-label { font-size: 14px; color: var(--text-muted); margin-bottom: 6px; display: block; }

  /* ===== 进度条 ===== */
  .progress-bar-wrap {
    position: fixed; top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--border);
    z-index: 999;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #2563eb, #60a5fa);
    transition: width 0.4s ease;
  }

  /* ===== 步骤指示 ===== */
  .step-badge {
    display: inline-block;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 13px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }

  /* ===== 情境视频占位符 ===== */
  .video-placeholder {
    background: linear-gradient(135deg, #1e293b, #334155);
    border-radius: 12px;
    padding: 60px 40px;
    text-align: center;
    color: white;
    margin: 24px 0;
    position: relative;
    overflow: hidden;
  }
  .video-placeholder::before {
    content: '';
    position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  .video-play-icon { font-size: 52px; margin-bottom: 12px; opacity: 0.9; }
  .video-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .video-desc { font-size: 14px; opacity: 0.7; }
  .video-timer { margin-top: 16px; font-size: 13px; opacity: 0.6; }

  /* ===== 筛选页面 ===== */
  .screen-out {
    text-align: center;
    padding: 40px;
  }
  .screen-out-icon { font-size: 56px; margin-bottom: 16px; }
  .screen-out-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
  .screen-out-text { color: var(--text-muted); font-size: 16px; line-height: 1.8; }

  /* ===== 结束页 ===== */
  .finish-page { text-align: center; padding: 20px 0; }
  .finish-icon { font-size: 64px; margin-bottom: 16px; }
  .finish-title { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
  .finish-text { color: var(--text-muted); font-size: 16px; line-height: 1.8; max-width: 480px; margin: 0 auto 32px; }
  .code-box {
    display: inline-block;
    background: var(--primary-light);
    color: var(--primary);
    border: 2px solid #bfdbfe;
    border-radius: 10px;
    padding: 16px 32px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 3px;
    margin-bottom: 20px;
  }

  /* ===== 静态AI内容 ===== */
  .static-ai-box {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin: 24px 0;
  }
  .static-ai-header {
    background: linear-gradient(135deg, #1e40af, #3b82f6);
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
  }
  .static-ai-body {
    padding: 24px;
    font-size: 15px;
    line-height: 1.9;
    background: var(--white);
  }

  /* ===== 响应式 ===== */
  @media (max-width: 600px) {
    .exp-card { padding: 24px 20px; margin: 16px; }
    .chip { font-size: 13px; padding: 7px 13px; }
  }
</style>
</head>
<body>

<div class="progress-bar-wrap">
  <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
</div>

<script>
// ============================================================
// 实验数据存储
// ============================================================
const DATA = {
  participant_id: 'P_' + Date.now() + '_' + Math.random().toString(36).substr(2,5),
  group: null,          // G1/G2/G3/G4
  interactivity: null,  // high/low
  conflict: null,       // high/low
  pretest_s1: null,     // 情境1前测答案
  pretest_s2: null,     // 情境2前测答案
  manipulation_check: {},
  test_answers: {},
  scale_answers: {},
  interactions: [],     // 记录交互过程
  timestamps: { start: new Date().toISOString() }
};

// ============================================================
// 实验材料配置
// ============================================================
const MATERIALS = {
  s1: {
    title: '情境一：自由落体',
    pretest_q: '将一个铁球（500g）和一个铁球（50g）从同一高度同时释放，忽略空气阻力，你认为哪个先落地？',
    pretest_opts: ['重的先落地', '轻的先落地', '两个同时落地', '不确定'],
    target_answer: 0,  // 选A（重的先落地）= 持有迷思概念
    video_title: '演示：两个铁球从高处同时释放',
    video_desc: '请观看视频，思考落地情况（视频不提供结论）',

    low_conflict: `关于这个问题，我来为你解释一下。

质量较大的物体受到的重力更大，因此在下落过程中获得的加速度也更大，所以质量越大的铁球下落速度越快，会更早落地。这是物体运动的基本规律，质量是影响下落速度的重要因素。

简单来说：<strong>重的铁球会先落地。</strong>`,

    high_conflict: `关于这个问题，我来为你解释一下。

在忽略空气阻力的条件下，物体下落的加速度只与重力加速度 g 有关，与物体的质量无关。无论铁球质量是 500g 还是 50g，两者所受重力与质量的比值（即加速度）完全相同，均为 g ≈ 9.8 m/s²。

简单来说：<strong>两个铁球会同时落地，质量不影响下落速度。</strong>`,

    scripts: {
      low: [
        { q: '为什么重的物体落得更快？', a: '因为质量越大，受到的重力越大（F=mg），更大的力使物体获得更快的速度，所以重物下落更快。这和我们日常生活中的直觉是一致的。' },
        { q: '那轻的物体就一定落得慢吗？', a: '是的，在相同高度释放时，质量较小的物体受到的重力较小，下落速度相对较慢，所以会晚一些落地。' },
        { q: '空气阻力有影响吗？', a: '空气阻力会有一些影响，但主要因素还是质量。质量大的物体重力更大，即使考虑空气阻力，重物依然会更快落地。' }
      ],
      high: [
        { q: '为什么质量不影响下落速度？', a: '虽然质量大的物体受到的重力更大，但它的惯性也更大，需要更大的力才能改变运动状态。这两个效应恰好相互抵消，所以最终加速度相同。用公式表示：a=F/m=mg/m=g，质量 m 被约掉了。' },
        { q: '那我们平时感觉重的东西落得快是错觉吗？', a: '在日常生活中有空气阻力的影响，轻的物体（比如羽毛）受空气阻力影响更大，所以看起来落得慢。但如果排除空气阻力，所有物体下落速度完全相同。伽利略当年就用实验证明了这一点。' },
        { q: '这怎么可能？重力不是更大吗？', a: '重力确实更大，但加速度取决于力和质量的比值，不是力本身。就像推一辆自行车和推一辆卡车，用同样比例的力，两者加速度是一样的道理。' }
      ]
    }
  },

  s2: {
    title: '情境二：惯性定律',
    pretest_q: '在完全光滑（无摩擦）的水平面上，一个运动的小球不受任何外力，你认为它会怎样？',
    pretest_opts: ['逐渐减速直到停止', '保持匀速直线运动永远运动下去', '先加速后减速', '不确定'],
    target_answer: 0,
    video_title: '演示：光滑平面上的运动小球',
    video_desc: '请观看视频，思考小球运动状态（视频不提供结论）',

    low_conflict: `关于这个问题，我来为你解释一下。

物体的运动需要力来维持。当物体受到推力时才能持续运动，一旦推力消失，物体就会因为没有驱动力而逐渐减慢并停止。我们日常生活中推动一个箱子，手一松它就停下来，正是这个道理。

简单来说：<strong>没有力的作用，运动的物体会逐渐停下来。</strong>`,

    high_conflict: `关于这个问题，我来为你解释一下。

根据牛顿第一定律，物体在不受外力的情况下会保持原有的运动状态。如果一个物体正在运动，且不受任何外力（包括摩擦力），它将永远保持匀速直线运动，不会减速也不会停止。我们日常生活中物体会停下来，是因为摩擦力的存在，而不是因为缺少驱动力。

简单来说：<strong>没有外力，运动的物体会永远运动下去。</strong>`,

    scripts: {
      low: [
        { q: '为什么物体需要力才能运动？', a: '因为物体本身没有自我驱动的能力，必须依靠外力才能产生和维持运动。就像汽车需要发动机提供动力才能行驶，失去动力就会停下来。' },
        { q: '那推箱子松手后停下来是因为什么？', a: '正是因为失去了推力，物体就没有了维持运动的动力，加上地面的阻力，所以很快就停下来了。这说明运动确实需要力来维持。' },
        { q: '在太空中物体会一直运动吗？', a: '太空中虽然阻力很小，但物体的运动仍然需要持续的推力来维持，否则速度会逐渐减小。只是太空中减速过程非常缓慢，看起来像是一直在运动。' }
      ],
      high: [
        { q: '为什么没有力物体还能继续运动？', a: '这是惯性的体现。物体具有保持原有运动状态的属性，不需要力来维持运动，只需要力来改变运动状态。力的作用是让物体加速、减速或改变方向，而不是维持运动本身。' },
        { q: '那推箱子松手后为什么会停下来？', a: '是因为摩擦力的存在。摩擦力是一种外力，它让物体减速直到停止。如果地面完全光滑没有摩擦力，箱子松手后会一直运动下去。我们日常看到物体停下来，原因是摩擦力，不是缺少驱动力。' },
        { q: '这和我们日常经验完全相反，怎么理解？', a: '日常生活中我们几乎无法消除摩擦力，所以直觉告诉我们运动需要力来维持。但这个直觉是错误的。伽利略和牛顿通过实验和推理发现，理想状态下（无摩擦）物体会永远运动，这才是运动的本质规律。' }
      ]
    }
  }
};

// ============================================================
// 量表配置
// ============================================================
const SCALES = {
  // 操控检验：认知冲突感知（CCLT简化版，5题）
  conflict_check: [
    '我感到AI给出的解释与我原本的想法有冲突。',
    '看到AI的解释后，我感到困惑或不解。',
    'AI的回答让我对自己原有的理解产生了怀疑。',
    '我觉得AI的解释与我的日常经验不一致。',
    '接触到AI的内容后，我需要重新思考这个问题。'
  ],
  // 操控检验：交互性感知（5题）
  interactivity_check: [
    '我能够自由地向AI提出自己想问的问题。',
    'AI对我的提问给予了及时的回应。',
    '我在这次学习过程中与AI进行了充分的互动。',
    '我感到这是一次双向的沟通，而不是单方面接收信息。',

function updateProgress(pct) {

function collectScaleAnswers(containerId, scaleKey, items) {
  const container = document.getElementById(containerId);
  const answers = {};
  let allAnswered = true;
  items.forEach((item, idx) => {
    const radios = container.querySelectorAll(`input[name="scale_${scaleKey}_${idx}"]`);
    let answered = false;
    radios.forEach(r => { if (r.checked) { answers[idx] = parseInt(r.value); answered = true; } });
    if (!answered) allAnswered = false;
  });
  return { answers, allAnswered };
}

function askQuestion(scenario, idx) {
  if (askedQuestions[scenario].includes(idx)) return;
  askedQuestions[scenario].push(idx);

  const mat = MATERIALS[scenario];
  const isHighConflict = DATA.conflict === 'high';
  const scripts = isHighConflict ? mat.scripts.high : mat.scripts.low;
  const qa = scripts[idx];

  // 记录交互
  DATA.interactions.push({ scenario, question_idx: idx, question: qa.q, answer: qa.a, time: new Date().toISOString() });

  // 添加消息到聊天区
  const chatEl = document.getElementById(`chat-messages-${scenario}`);
  chatEl.innerHTML += `
    <div class="msg msg-user">
      <div class="msg-icon">🙋</div>
      <div class="msg-bubble">${qa.q}</div>
    </div>`;

  setTimeout(() => {
    chatEl.innerHTML += `
      <div class="msg msg-ai">
        <div class="msg-icon">🤖</div>
        <div class="msg-bubble">${qa.a}</div>
      </div>`;
    chatEl.scrollTop = chatEl.scrollHeight;
  }, 600);

  // 禁用已点击的按钮
  const btn = document.getElementById(`chip-${scenario}-${idx}`);
  if (btn) { btn.disabled = true; btn.classList.add('disabled'); }
  chatEl.scrollTop = chatEl.scrollHeight;
}

      ${s1T.map((item, i) => renderItem(item, 's1_trans', i)).join('')}

// ============================================================
// 事件绑定
// ============================================================
function bindEvents(stepId) {
  const get = (id) => document.getElementById(id);

  if (stepId === 'consent') {
    get('btn-consent')?.addEventListener('click', () => nextStep('pretest_s1'));
  }

  if (stepId === 'pretest_s1') {
    get('btn-pretest-s1')?.addEventListener('click', () => {
      const radios = document.querySelectorAll('input[name="pretest_s1"]');
      let selected = null;
      radios.forEach(r => { if (r.checked) selected = parseInt(r.value); });
      if (selected === null) { alert('请选择一个答案后继续。'); return; }
      DATA.pretest_s1 = selected;
      if (selected !== MATERIALS.s1.target_answer) nextStep('screen_out_s1');
      else nextStep('pretest_s2');
    });
  }

  if (stepId === 'screen_out_s1') { /* 终止，无后续按钮 */ }

  if (stepId === 'pretest_s2') {
    get('btn-pretest-s2')?.addEventListener('click', () => {
      const radios = document.querySelectorAll('input[name="pretest_s2"]');
      let selected = null;
      radios.forEach(r => { if (r.checked) selected = parseInt(r.value); });
      if (selected === null) { alert('请选择一个答案后继续。'); return; }
      DATA.pretest_s2 = selected;
      if (selected !== MATERIALS.s2.target_answer) nextStep('screen_out_s2');
      else nextStep('assign_group');
    });
  }

  if (stepId === 'screen_out_s2') { /* 终止 */ }

  if (stepId === 'assign_group') {
    get('btn-start-s1')?.addEventListener('click', () => nextStep('intro_s1'));
  }

  if (stepId === 'intro_s1') {
    get('btn-intro-s1')?.addEventListener('click', () => nextStep('video_s1'));
  }

  if (stepId === 'video_s1') {
    get('btn-video-s1')?.addEventListener('click', () => nextStep('ai_content_s1'));
  }

  if (stepId === 'ai_content_s1') {
    get('btn-ai-done-s1')?.addEventListener('click', () => nextStep('manip_check_s1'));
  }

  if (stepId === 'manip_check_s1') {
    get('btn-mc-s1')?.addEventListener('click', () => {
      // 收集操控检验数据
      const { answers: ca, allAnswered: ca_ok } = collectScaleAnswers('mc-container-s1', 'conflict_s1', SCALES.conflict_check);
      const { answers: ia, allAnswered: ia_ok } = collectScaleAnswers('mc-container-s1', 'inter_s1', SCALES.interactivity_check);
      if (!ca_ok || !ia_ok) { alert('请回答所有题目后继续。'); return; }
      DATA.manipulation_check.s1_conflict = ca;
      DATA.manipulation_check.s1_interactivity = ia;
      nextStep('intro_s2');
    });
  }

  if (stepId === 'intro_s2') {
    get('btn-intro-s2')?.addEventListener('click', () => nextStep('video_s2'));
  }

  if (stepId === 'video_s2') {
    get('btn-video-s2')?.addEventListener('click', () => nextStep('ai_content_s2'));
  }

  if (stepId === 'ai_content_s2') {
    get('btn-ai-done-s2')?.addEventListener('click', () => nextStep('manip_check_s2'));
  }

  if (stepId === 'manip_check_s2') {
    get('btn-mc-s2')?.addEventListener('click', () => {
      const { answers: ca, allAnswered: ca_ok } = collectScaleAnswers('mc-container-s2', 'conflict_s2', SCALES.conflict_check);
      const { answers: ia, allAnswered: ia_ok } = collectScaleAnswers('mc-container-s2', 'inter_s2', SCALES.interactivity_check);
      if (!ca_ok || !ia_ok) { alert('请回答所有题目后继续。'); return; }
      DATA.manipulation_check.s2_conflict = ca;
      DATA.manipulation_check.s2_interactivity = ia;
      nextStep('test');
    });
  }

  if (stepId === 'test') {
    get('btn-test')?.addEventListener('click', () => {
      // 收集测验数据
      const testKeys = [
        { key: 's1_recall', items: TEST_ITEMS.s1_recall },
        { key: 's1_comp', items: TEST_ITEMS.s1_comprehension },
        { key: 's1_trans', items: TEST_ITEMS.s1_transfer },
        { key: 's2_recall', items: TEST_ITEMS.s2_recall },
        { key: 's2_comp', items: TEST_ITEMS.s2_comprehension },
        { key: 's2_trans', items: TEST_ITEMS.s2_transfer }
      ];
      let allOk = true;
      testKeys.forEach(({ key, items }) => {
        DATA.test_answers[key] = [];
        items.forEach((item, i) => {
          const radios = document.querySelectorAll(`input[name="${key}_${i}"]`);
          let selected = null;
          radios.forEach(r => { if (r.checked) selected = parseInt(r.value); });
          if (selected === null) allOk = false;
          const reason = document.getElementById(`reason_${key}_${i}`)?.value || '';
          DATA.test_answers[key].push({ selected, correct: item.correct, is_correct: selected === item.correct, reason });
        });
      });
      if (!allOk) { alert('请回答所有选择题后再提交。'); return; }
      nextStep('scale_spq');
    });
  }

  if (stepId === 'scale_spq') {
    get('btn-spq')?.addEventListener('click', () => {
      const { answers, allAnswered } = collectScaleAnswers('spq-container', 'spq', SCALES.spq);
      if (!allAnswered) { alert('请回答所有题目后继续。'); return; }
      DATA.scale_answers.spq = answers;
      nextStep('scale_mai');
    });
  }

  if (stepId === 'scale_mai') {
    get('btn-mai')?.addEventListener('click', () => {
      const { answers, allAnswered } = collectScaleAnswers('mai-container', 'mai', SCALES.mai);
      if (!allAnswered) { alert('请回答所有题目后继续。'); return; }
      DATA.scale_answers.mai = answers;
      nextStep('finish');
    });
  }
}

// ============================================================
