<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习研究实验</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspsych/7.3.4/jspsych.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jspsych/7.3.4/themes/default.css">
<style>
  /* ===== 全局样式 ===== */
  :root {
    --primary: #2563eb;
    --primary-light: #eff6ff;
    --text: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --bg: #f8fafc;
    --white: #ffffff;
    --success: #16a34a;
    --warning: #d97706;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
  }

  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
    margin: 0;
  }

  .jspsych-content-wrapper {
    max-width: 820px !important;
  }

  .jspsych-content {
    padding: 0 !important;
    max-width: 100% !important;
  }

  /* ===== 卡片容器 ===== */
  .exp-card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 48px;
    margin: 32px auto;
    max-width: 780px;
  }

  .exp-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 8px 0;
  }

  .exp-subtitle {
    font-size: 14px;
    color: var(--text-muted);
    margin: 0 0 32px 0;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .exp-body {
    font-size: 16px;
    color: var(--text);
    line-height: 1.9;
  }

  /* ===== 按钮 ===== */
  .btn {
    display: inline-block;
    padding: 14px 36px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 24px;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
  .btn:active { transform: translateY(0); }
  .btn-secondary { background: var(--white); color: var(--primary); border: 2px solid var(--primary); }
  .btn-secondary:hover { background: var(--primary-light); }

  /* ===== 前测选择题 ===== */
  .pretest-options { list-style: none; padding: 0; margin: 24px 0; }
  .pretest-options li {
    margin-bottom: 12px;
  }
  .pretest-options label {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 16px;
  }
  .pretest-options label:hover { border-color: var(--primary); background: var(--primary-light); }
  .pretest-options input[type=radio] { width: 18px; height: 18px; accent-color: var(--primary); flex-shrink: 0; }
  .pretest-options input[type=radio]:checked + span { font-weight: 600; }
  .pretest-options label:has(input:checked) { border-color: var(--primary); background: var(--primary-light); }

  /* ===== AI 聊天界面 ===== */
  .chat-container {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin: 24px 0;
    background: var(--white);
  }

  .chat-header {
    background: linear-gradient(135deg, #1e40af, #3b82f6);
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .chat-avatar {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .chat-header-info { line-height: 1.3; }
  .chat-header-name { font-weight: 700; font-size: 15px; }
  .chat-header-status { font-size: 12px; opacity: 0.85; }

  .chat-messages {
    padding: 20px;
    min-height: 200px;
    max-height: 420px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: #f9fafb;
  }

  .msg {
    display: flex;
    gap: 10px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .msg-ai { align-items: flex-start; }
  .msg-user { flex-direction: row-reverse; }

  .msg-icon {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .msg-ai .msg-icon { background: linear-gradient(135deg, #1e40af, #3b82f6); color: white; }
  .msg-user .msg-icon { background: #e2e8f0; }

  .msg-bubble {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.7;
  }
  .msg-ai .msg-bubble { background: var(--white); border: 1px solid var(--border); border-top-left-radius: 4px; color: var(--text); }
  .msg-user .msg-bubble { background: var(--primary); color: white; border-top-right-radius: 4px; }

  /* ===== 预设问题按钮 ===== */
  .question-chips {
    padding: 16px 20px;
    background: var(--white);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .question-chips-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .chips-row { display: flex; flex-wrap: wrap; gap: 8px; }

  .chip {
    padding: 8px 16px;
    background: var(--primary-light);
    color: var(--primary);
    border: 1px solid #bfdbfe;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    text-align: left;
  }
  .chip:hover { background: var(--primary); color: white; border-color: var(--primary); }
  .chip:disabled { opacity: 0.4; cursor: not-allowed; background: var(--primary-light); color: var(--primary); }

  /* ===== 量表 ===== */
  .scale-item {
    margin-bottom: 28px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }
  .scale-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

  .scale-q {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    color: var(--text);
  }

  .scale-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .scale-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 4px;
  }

  .scale-point {
    flex: 1;
    text-align: center;
  }

  .scale-point input[type=radio] { accent-color: var(--primary); width: 20px; height: 20px; cursor: pointer; }
  .scale-point label { display: block; font-size: 13px; color: var(--text-muted); margin-top: 4px; cursor: pointer; }

  /* ===== 测验题 ===== */
  .test-item {
    margin-bottom: 32px;
    padding: 24px;
    background: var(--bg);
    border-radius: 10px;
    border-left: 4px solid var(--primary);
  }

  .test-q {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text);
  }

  .test-options { list-style: none; padding: 0; margin: 0 0 12px 0; }
  .test-options li { margin-bottom: 8px; }
  .test-options label {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    transition: all 0.15s;
    background: var(--white);
  }
  .test-options label:hover { border-color: var(--primary); background: var(--primary-light); }
  .test-options input[type=radio] { margin-top: 3px; accent-color: var(--primary); flex-shrink: 0; }
  .test-options label:has(input:checked) { border-color: var(--primary); background: var(--primary-light); }

  .test-textarea {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    line-height: 1.7;
    resize: vertical;
    min-height: 80px;
    color: var(--text);
    box-sizing: border-box;
    transition: border-color 0.15s;
  }
  .test-textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
  .test-textarea-label { font-size: 14px; color: var(--text-muted); margin-bottom: 6px; display: block; }

  /* ===== 进度条 ===== */
  .progress-bar-wrap {
    position: fixed; top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--border);
    z-index: 999;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #2563eb, #60a5fa);
    transition: width 0.4s ease;
  }

  /* ===== 步骤指示 ===== */
  .step-badge {
    display: inline-block;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 13px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }

  /* ===== 情境视频占位符 ===== */
  .video-placeholder {
    background: linear-gradient(135deg, #1e293b, #334155);
    border-radius: 12px;
    padding: 60px 40px;
    text-align: center;
    color: white;
    margin: 24px 0;
    position: relative;
    overflow: hidden;
  }
  .video-placeholder::before {
    content: '';
    position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  .video-play-icon { font-size: 52px; margin-bottom: 12px; opacity: 0.9; }
  .video-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .video-desc { font-size: 14px; opacity: 0.7; }
  .video-timer { margin-top: 16px; font-size: 13px; opacity: 0.6; }

  /* ===== 筛选页面 ===== */
  .screen-out {
    text-align: center;
    padding: 40px;
  }
  .screen-out-icon { font-size: 56px; margin-bottom: 16px; }
  .screen-out-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
  .screen-out-text { color: var(--text-muted); font-size: 16px; line-height: 1.8; }

  /* ===== 结束页 ===== */
  .finish-page { text-align: center; padding: 20px 0; }
  .finish-icon { font-size: 64px; margin-bottom: 16px; }
  .finish-title { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
  .finish-text { color: var(--text-muted); font-size: 16px; line-height: 1.8; max-width: 480px; margin: 0 auto 32px; }
  .code-box {
    display: inline-block;
    background: var(--primary-light);
    color: var(--primary);
    border: 2px solid #bfdbfe;
    border-radius: 10px;
    padding: 16px 32px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 3px;
    margin-bottom: 20px;
  }

  /* ===== 静态AI内容 ===== */
  .static-ai-box {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin: 24px 0;
  }
  .static-ai-header {
    background: linear-gradient(135deg, #1e40af, #3b82f6);
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
  }
  .static-ai-body {
    padding: 24px;
    font-size: 15px;
    line-height: 1.9;
    background: var(--white);
  }

  /* ===== 响应式 ===== */
  @media (max-width: 600px) {
    .exp-card { padding: 24px 20px; margin: 16px; }
    .chip { font-size: 13px; padding: 7px 13px; }
  }
</style>
</head>

function updateConditionBadge() {
  const badge = document.getElementById('condition-badge');
  if (!badge || !DATA.group) return;
  const interLabel = DATA.interactivity === 'high' ? '高交互' : '低交互';
  const conflictLabel = DATA.conflict === 'high' ? '高冲突' : '低冲突';
  badge.textContent = `实验条件：${DATA.group}｜${interLabel}｜${conflictLabel}`;
  badge.style.display = 'block';
}

function updateProgress(pct) {
  document.getElementById('progressBar').style.width = pct + '%';
}

function collectScaleAnswers(containerId, scaleKey, items) {
  const container = document.getElementById(containerId);
  const answers = {};
  let allAnswered = true;
  items.forEach((item, idx) => {
    const radios = container.querySelectorAll(`input[name="scale_${scaleKey}_${idx}"]`);
    let answered = false;
    radios.forEach(r => { if (r.checked) { answers[idx] = parseInt(r.value); answered = true; } });
    if (!answered) allAnswered = false;
  });
  return { answers, allAnswered };
}

function renderScaleItems(items, scaleKey, containerId) {
  return items.map((item, idx) => `
    <div class="scale-item">
      <div class="scale-q">${idx + 1}. ${item}</div>
      <div class="scale-labels">
        <span>完全不同意</span>
        <span>完全同意</span>
      </div>
      <div class="scale-row">
        ${[1,2,3,4,5].map(v => `
          <div class="scale-point">
            <input type="radio" name="scale_${scaleKey}_${idx}" id="sc_${scaleKey}_${idx}_${v}" value="${v}">
            <label for="sc_${scaleKey}_${idx}_${v}">${v}</label>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function exportData() {
  DATA.timestamps.end = new Date().toISOString();
  const json = JSON.stringify(DATA, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `exp_data_${DATA.participant_id}.json`;
  a.click();
  URL.revokeObjectURL(url);
  

}

  const content = document.getElementById('jspsych-content') || document.body;
  const steps = {

    'pretest_s1': () => renderPretest('s1'),

    'intro_s2': () => renderIntro('s2'),
    'ai_content_s2': () => renderAIContent('s2'),
    'manip_check_s2': () => renderManipCheck('s2'),
    'test': renderTest,
    'scale_spq': renderScaleSPQ,
    'scale_mai': renderScaleMAI,
    'finish': renderFinish
  };
  if (steps[id]) {
    document.body.innerHTML = '';
    // 重建进度条
    const pb = document.createElement('div');
    pb.className = 'progress-bar-wrap';
    pb.innerHTML = `<div class="progress-bar-fill" id="progressBar" style="width:${Math.round((currentStep/totalSteps)*100)}%"></div>`;
    document.body.appendChild(pb);

    // 重建条件标注
    const cb = document.createElement('div');
    cb.id = 'condition-badge';
    cb.style.cssText = 'position:fixed;bottom:16px;right:16px;background:rgba(30,41,59,0.82);color:#94a3b8;font-size:11px;font-family:PingFang SC,Microsoft YaHei,sans-serif;padding:6px 12px;border-radius:20px;letter-spacing:0.5px;pointer-events:none;z-index:9999;backdrop-filter:blur(4px);display:none;';
    document.body.appendChild(cb);
    updateConditionBadge();

    const wrapper = document.createElement('div');
    wrapper.id = 'main-wrapper';
    wrapper.style.padding = '20px 16px 60px';
    document.body.appendChild(wrapper);
    const result = steps[id]();
    if (result instanceof Promise) {
      result.then(html => { if(html) wrapper.innerHTML = html; });
    } else {
      wrapper.innerHTML = result;
    }
    bindEvents(id);
  }
}

async function getBalancedGroup() {
  const SUPABASE_URL = 'https://fafnnpnygtfbcfwxchpx.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhZm5ucG55Z3RmYmNmd3hjaHB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzODAwNDIsImV4cCI6MjA5NTk1NjA0Mn0.RPLUVdDYdajI8OaMPlfs73O2amXhxxdMI8QnXofLyyY';
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/experiment_data?select=data->>group`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    if (!res.ok) throw new Error('fetch failed');
    const rows = await res.json();
    const counts = { G1: 0, G2: 0, G3: 0, G4: 0 };
    rows.forEach(r => { if (counts[r.group] !== undefined) counts[r.group]++; });

    const candidates = Object.keys(counts).filter(g => counts[g] === minCount);
    return candidates[Math.floor(Math.random() * candidates.length)];
  } catch (e) {
    // 网络失败时纯随机
    const groups = ['G1', 'G2', 'G3', 'G4'];
    return groups[Math.floor(Math.random() * 4)];
  }
}

function askQuestion(scenario, idx) {
  if (askedQuestions[scenario].includes(idx)) return;
  askedQuestions[scenario].push(idx);

  const mat = MATERIALS[scenario];
  const isHighConflict = DATA.conflict === 'high';
  const scripts = isHighConflict ? mat.scripts.high : mat.scripts.low;
  const qa = scripts[idx];

  // 记录交互
  DATA.interactions.push({ scenario, question_idx: idx, question: qa.q, answer: qa.a, time: new Date().toISOString() });

  // 添加消息到聊天区
  const chatEl = document.getElementById(`chat-messages-${scenario}`);
  chatEl.innerHTML += `
    <div class="msg msg-user">
      <div class="msg-icon">🙋</div>
      <div class="msg-bubble">${qa.q}</div>
    </div>`;

  setTimeout(() => {
    chatEl.innerHTML += `
      <div class="msg msg-ai">
        <div class="msg-icon">🤖</div>
        <div class="msg-bubble">${qa.a}</div>
      </div>`;
    chatEl.scrollTop = chatEl.scrollHeight;
  }, 600);

  // 禁用已点击的按钮
  const btn = document.getElementById(`chip-${scenario}-${idx}`);
  if (btn) { btn.disabled = true; btn.classList.add('disabled'); }
  chatEl.scrollTop = chatEl.scrollHeight;
}

function bindEvents(stepId) {
  const get = (id) => document.getElementById(id);

  if (stepId === 'consent') {
    get('btn-consent')?.addEventListener('click', () => nextStep('demographics'));
  }

  if (stepId === 'demographics') {
    get('btn-demographics')?.addEventListener('click', () => {
      const gender = document.querySelector('input[name="demo_gender"]:checked')?.value;
      const grade = document.querySelector('select[name="demo_grade"]')?.value;
      const major = document.getElementById('demo_major')?.value.trim();
      const ai_freq = document.querySelector('input[name="demo_ai_freq"]:checked')?.value;
      if (!gender || !grade || !major || !ai_freq) {
        alert('请填写所有基本信息后继续。'); return;
      }
      DATA.demographics = { gender, grade, major, ai_freq };
      nextStep('pretest_s1');
    });
  }

  if (stepId === 'pretest_s1') {
    get('btn-pretest-s1')?.addEventListener('click', () => {
      const radios = document.querySelectorAll('input[name="pretest_s1"]');
      let selected = null;
      radios.forEach(r => { if (r.checked) selected = parseInt(r.value); });
      if (selected === null) { alert('请选择一个答案后继续。'); return; }
      DATA.pretest_s1 = selected;
      if (selected !== MATERIALS.s1.target_answer) nextStep('screen_out_s1');
      else nextStep('pretest_s2');
    });
  }

  if (stepId === 'screen_out_s1') { /* 终止，无后续按钮 */ }

  if (stepId === 'pretest_s2') {
    get('btn-pretest-s2')?.addEventListener('click', () => {
      const radios = document.querySelectorAll('input[name="pretest_s2"]');
      let selected = null;
      radios.forEach(r => { if (r.checked) selected = parseInt(r.value); });
      if (selected === null) { alert('请选择一个答案后继续。'); return; }
      DATA.pretest_s2 = selected;
      if (selected !== MATERIALS.s2.target_answer) nextStep('screen_out_s2');
      else nextStep('assign_group');
    });
  }

  if (stepId === 'screen_out_s2') { /* 终止 */ }

  if (stepId === 'assign_group') {
    get('btn-start-s1')?.addEventListener('click', () => nextStep('intro_s1'));
  }

  if (stepId === 'intro_s1') {
    get('btn-intro-s1')?.addEventListener('click', () => nextStep('ai_content_s1'));
  }

  if (stepId === 'ai_content_s1') {
    get('btn-ai-done-s1')?.addEventListener('click', () => nextStep('manip_check_s1'));
  }

  if (stepId === 'manip_check_s1') {
    get('btn-mc-s1')?.addEventListener('click', () => {
      // 收集操控检验数据
      const { answers: ca, allAnswered: ca_ok } = collectScaleAnswers('mc-container-s1', 'conflict_s1', SCALES.conflict_check);
      const { answers: ia, allAnswered: ia_ok } = collectScaleAnswers('mc-container-s1', 'inter_s1', SCALES.interactivity_check);
      if (!ca_ok || !ia_ok) { alert('请回答所有题目后继续。'); return; }
      DATA.manipulation_check.s1_conflict = ca;
      DATA.manipulation_check.s1_interactivity = ia;
      nextStep('intro_s2');
    });
  }

  if (stepId === 'intro_s2') {
    get('btn-intro-s2')?.addEventListener('click', () => nextStep('ai_content_s2'));
  }

  if (stepId === 'ai_content_s2') {
    get('btn-ai-done-s2')?.addEventListener('click', () => nextStep('manip_check_s2'));
  }

  if (stepId === 'manip_check_s2') {
    get('btn-mc-s2')?.addEventListener('click', () => {
      const { answers: ca, allAnswered: ca_ok } = collectScaleAnswers('mc-container-s2', 'conflict_s2', SCALES.conflict_check);
      const { answers: ia, allAnswered: ia_ok } = collectScaleAnswers('mc-container-s2', 'inter_s2', SCALES.interactivity_check);
      if (!ca_ok || !ia_ok) { alert('请回答所有题目后继续。'); return; }
      DATA.manipulation_check.s2_conflict = ca;
      DATA.manipulation_check.s2_interactivity = ia;
      nextStep('test');
    });
  }

  if (stepId === 'test') {
    get('btn-test')?.addEventListener('click', () => {
      // 收集测验数据
      const testKeys = [
        { key: 's1_recall', items: TEST_ITEMS.s1_recall },
        { key: 's1_comp', items: TEST_ITEMS.s1_comprehension },
        { key: 's1_trans', items: TEST_ITEMS.s1_transfer },
        { key: 's2_recall', items: TEST_ITEMS.s2_recall },
        { key: 's2_comp', items: TEST_ITEMS.s2_comprehension },
        { key: 's2_trans', items: TEST_ITEMS.s2_transfer }
      ];
      let allOk = true;
      testKeys.forEach(({ key, items }) => {
        DATA.test_answers[key] = [];
        items.forEach((item, i) => {
          const radios = document.querySelectorAll(`input[name="${key}_${i}"]`);
          let selected = null;
          radios.forEach(r => { if (r.checked) selected = parseInt(r.value); });
          if (selected === null) allOk = false;
          const reason = document.getElementById(`reason_${key}_${i}`)?.value || '';
          DATA.test_answers[key].push({ selected, correct: item.correct, is_correct: selected === item.correct, reason });
        });
      });
      if (!allOk) { alert('请回答所有选择题后再提交。'); return; }
      nextStep('scale_spq');
    });
  }

  if (stepId === 'scale_spq') {
    get('btn-spq')?.addEventListener('click', () => {
      const { answers, allAnswered } = collectScaleAnswers('spq-container', 'spq', SCALES.spq);
      if (!allAnswered) { alert('请回答所有题目后继续。'); return; }
      DATA.scale_answers.spq = answers;
      nextStep('scale_mai');
    });
  }

  if (stepId === 'scale_mai') {
    get('btn-mai')?.addEventListener('click', () => {
      const { answers, allAnswered } = collectScaleAnswers('mai-container', 'mai', SCALES.mai);
      if (!allAnswered) { alert('请回答所有题目后继续。'); return; }
      DATA.scale_answers.mai = answers;
      nextStep('finish');
    });
  }
}

// ============================================================
// 启动实验
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  showStep('consent');
});
</script>
